<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

  <div class="recipes">
        <h1>Recipes Overview</h1>
          <div class="container">
              <div class="row" id="tags-container">

              </div>
          </div>
		  <div class="container">
		    <div class="row" id="recipes-container">
		     
		     
		    </div>
		  </div>
     </div>

	</body>


	   <script type="text/template" id="recipe-template">
        <div class="card mb-4 box-shadow <% _.each(tags, function(el) { %>  tag-<%= el %><% }); %>">
          <div class="card-body">
            <div class="card-text">
              <%= name %>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.open('<%= link %>','_blank')">Open</button>
              <div class="tags">
                  <% _.each(tags, function(el) { %>  <span class="badge badge-pill badge-info"><%= el %></span> <% }); %>
              </div>
            </div>
        </div>
      </script>

<script type="text/template" id="tags-selector-template">

        <% _.each(tags, function(el) { %>
            <div class="mb-2">
            <button type="button" class="btn btn-info btn-sm btn-tag-sel tag-<%= el %>" data-toggle="button" aria-pressed="false" tagVal="<%= el %>">
                <%= el %>
            </button>
                </div>
        <% }); %>

</script>

</html>
