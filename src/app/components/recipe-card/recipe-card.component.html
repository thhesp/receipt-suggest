<div class="card recipe-card h-100" (click)="onCardClick($event)">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ recipe.name }}</h5>

    <div class="tags mb-3">
      <span *ngFor="let tag of recipe.tags" class="badge bg-info me-2 mb-2">
        {{ tag }}
      </span>
    </div>

    <div class="mt-auto">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="onCardClick($event)"
        [routerLink]="!recipe.external ? ['/recipe', recipe.link] : null"
        [href]="recipe.external ? recipe.link : null"
        [target]="recipe.external ? '_blank' : null"
      >
        {{ recipe.external ? 'External Link' : 'View Recipe' }}
      </button>
    </div>
  </div>
</div>
