<div class="card recipe-card h-100">
  <img
    *ngIf="thumbnailUrl"
    class="card-img-top recipe-thumbnail"
    [src]="thumbnailUrl"
    [alt]="recipe.name"
    loading="lazy"
    decoding="async"
  />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ recipe.name }}</h5>

    <p *ngIf="recipe.kcalPerPortion" class="kcalPerPortion-info mb-3">
      <strong>KCal pro Portion:</strong> {{ recipe.kcalPerPortion }}
    </p>

    <div class="tags mb-3">
      <span *ngIf="isFavorite" class="badge favorite-mark me-2 mb-2">
        &#9829; Favorite
      </span>
      <span *ngFor="let tag of recipe.tags" class="badge bg-info me-2 mb-2">
        {{ tag }}
      </span>
    </div>

    <div class="mt-auto">
      <button
        class="favorite-button mb-2"
        type="button"
        [class.is-favorite]="isFavorite"
        [attr.aria-label]="isFavorite ? 'Remove ' + recipe.name + ' from favorites' : 'Add ' + recipe.name + ' to favorites'"
        [attr.aria-pressed]="isFavorite"
        (click)="toggleFavorite()"
      >
        <span *ngIf="isFavorite" aria-hidden="true">&#9829;</span>
        <span *ngIf="!isFavorite" aria-hidden="true">&#9825;</span>
      </button>
      <!-- Internal link -->
      <button
        *ngIf="!recipe.externalUrl"
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        [routerLink]="['/recipe', recipe.id]"
        [queryParams]="{ name: recipe.name }"
      >
        View Recipe
      </button>

      <!-- External link -->
      <a
        *ngIf="recipe.externalUrl"
        [href]="recipe.externalUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-sm btn-outline-secondary w-100 text-decoration-none"
      >
        External Link
      </a>
    </div>
  </div>
</div>
