<div class="card recipe-card h-100" (click)="onCardClick($event)">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ recipe.name }}</h5>

    <div class="tags mb-3">
      <span *ngFor="let tag of recipe.tags" class="badge bg-info me-2 mb-2">
        {{ tag }}
      </span>
    </div>

    <div class="mt-auto">
      <!-- Internal link -->
      <button
        *ngIf="!recipe.external"
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        [routerLink]="['/recipe', recipe.link]"
      >
        View Recipe
      </button>

      <!-- External link -->
      <a
        *ngIf="recipe.external"
        [href]="recipe.link"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-sm btn-outline-secondary w-100 text-decoration-none"
      >
        External Link
      </a>
    </div>
  </div>
</div>
