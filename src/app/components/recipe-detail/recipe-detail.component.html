<div class="recipe-detail-container">
  <h1 class="mb-5">{{ recipeName }}</h1>

  <ng-container *ngIf="isLoading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="error">
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
  </ng-container>

  <ng-container *ngIf="!isLoading && !error">
    <div class="detail-actions mb-4">
      <button
        class="favorite-button"
        [class.is-favorite]="isFavorite"
        type="button"
        [attr.aria-pressed]="isFavorite"
        [attr.aria-label]="isFavorite ? 'Remove recipe from favorites' : 'Add recipe to favorites'"
        (click)="toggleFavorite()"
      >
        <span *ngIf="isFavorite" aria-hidden="true">&#9829;</span>
        <span *ngIf="!isFavorite" aria-hidden="true">&#9825;</span>
        {{ isFavorite ? 'Favorite' : 'Add favorite' }}
      </button>
      <div class="form-check form-switch">
        <input
          id="plan-to-cook"
          class="form-check-input"
          type="checkbox"
          [checked]="isPlanned"
          (change)="togglePlanned()"
        />
        <label class="form-check-label" for="plan-to-cook">
          Plan to cook
        </label>
      </div>
      <div *ngIf="wakeLockSupported" class="form-check form-switch">
        <input
          id="wake-lock"
          class="form-check-input"
          type="checkbox"
          [checked]="isWakeLockEnabled"
          (change)="toggleWakeLock()"
        />
        <label class="form-check-label" for="wake-lock">
          Keep screen on while cooking
        </label>
      </div>
    </div>

    <!-- Ingredients Section -->
    <div *ngIf="(ingredients$ | async)?.length as ingredientCount">
      <div class="container-md mb-5">
        <h3 class="mb-3">Ingredients</h3>
        <div *ngIf="ingredientCount > 0">
          <button
            *ngIf="!isSelectingIngredients"
            class="btn btn-outline-primary mb-3"
            type="button"
            (click)="startIngredientSelection()"
          >
            Select ingredients to copy
          </button>
          <div *ngIf="isSelectingIngredients" class="mb-3">
            <p class="mb-2">Choose the ingredients to copy.</p>
            <button
              class="btn btn-outline-primary me-2"
              type="button"
              [disabled]="!hasSelectedIngredients()"
              (click)="copySelectedIngredients()"
            >
              Copy selected ingredients
            </button>
            <button
              class="btn btn-outline-success me-2"
              type="button"
              [disabled]="!hasSelectedIngredients()"
              (click)="addSelectedIngredientsToShoppingList()"
            >
              Add selected to shopping list
            </button>
            <button class="btn btn-outline-secondary" type="button" (click)="cancelIngredientSelection()">
              Cancel
            </button>
          </div>
          <span class="copy-status ms-2" *ngIf="copyStatus === 'copied'">Copied</span>
          <span class="copy-status text-danger ms-2" *ngIf="copyStatus === 'failed'">
            Copy failed
          </span>
          <span class="copy-status ms-2" *ngIf="copyStatus === 'added'">
            Added to shopping list
          </span>
          <table class="table table-striped table-bordered table-sm">
            <thead>
              <tr>
                <th *ngIf="isSelectingIngredients" scope="col">
                  <span class="visually-hidden">Select</span>
                </th>
                <th scope="col">Name</th>
                <th scope="col">Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let ingredient of ingredients$ | async; let i = index">
                <td *ngIf="isSelectingIngredients">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    [checked]="selectedIngredientIndexes.has(i)"
                    [attr.aria-label]="'Select ' + ingredient.name"
                    (change)="updateIngredientSelection(i, $any($event.target).checked)"
                  />
                </td>
                <td>{{ ingredient.name }}</td>
                <td>{{ ingredient.amount }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Description Section -->
    <div *ngIf="description$ | async as description">
      <div class="container-md mb-5">
        <h3 class="mb-3">Description</h3>
        <div class="description-content">
          <div [innerHTML]="description"></div>
        </div>
      </div>
    </div>

    <!-- Images are optional and loaded after the recipe content. -->
    <div *ngIf="imagesLoading" class="container-md mb-5 text-muted" aria-live="polite">
      Loading images...
    </div>
    <div *ngIf="(images$ | async)?.length as imageCount">
      <div class="container-md mb-5">
        <div class="row" *ngIf="imageCount > 0">
          <div class="col-md-6" *ngFor="let image of images$ | async; let i = index">
            <div class="card mb-4 box-shadow">
              <div class="card-body">
                <img
                  class="recipe-image"
                  [src]="image"
                  alt="Recipe image"
                  (click)="openImageModal(i)"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<!-- Image Modal -->
<div id="img-modal" class="modal" [class.show]="showModal" (click)="onModalClick($event)">
  <span class="close" (click)="closeModal()">&times;</span>

  <div class="modal-content-wrapper">
    <img class="modal-content" [src]="(images$ | async)?.[selectedImageIndex]" alt="Recipe image full" />

    <div class="modal-controls" *ngIf="(images$ | async)?.length as count">
      <button class="modal-btn modal-prev" (click)="prevImage()" *ngIf="count > 1">
        &#10094;
      </button>
      <span class="modal-counter" *ngIf="count > 1">
        {{ selectedImageIndex + 1 }} / {{ count }}
      </span>
      <button class="modal-btn modal-next" (click)="nextImage()" *ngIf="count > 1">
        &#10095;
      </button>
    </div>
  </div>
</div>
