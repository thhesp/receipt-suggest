<div class="shopping-list-container">
  <h1 class="mb-4">Shopping List</h1>

  <div *ngIf="groups$ | async as groups">
    <div *ngIf="groups.length === 0" class="alert alert-info">
      Add selected ingredients from a recipe to build your shopping list.
    </div>

    <div *ngIf="groups.length > 0" class="mb-3">
      <button class="btn btn-outline-primary me-2" type="button" (click)="copy(groups)">Copy list</button>
      <button class="btn btn-outline-danger" type="button" (click)="clear()">Clear list</button>
    </div>
    <p *ngIf="status" class="text-success" aria-live="polite">{{ status }}</p>
    <section *ngFor="let group of groups" class="mb-4">
      <h2 class="h5">{{ group.recipeName }}</h2>
      <ul class="list-group">
      <li *ngFor="let item of group.items" class="list-group-item d-flex align-items-center gap-3">
        <input
          class="form-check-input mt-0"
          type="checkbox"
          [checked]="item.checked"
          [attr.aria-label]="'Mark ' + item.name + ' as bought'"
          (change)="updateChecked(item.id, $any($event.target).checked)"
        />
        <span class="flex-grow-1" [class.text-decoration-line-through]="item.checked">
          {{ item.amount }} {{ item.name }}
        </span>
        <button class="btn btn-sm btn-outline-danger" type="button" (click)="removeItem(item.id)">
          Remove
        </button>
      </li>
      </ul>
    </section>
  </div>
</div>
