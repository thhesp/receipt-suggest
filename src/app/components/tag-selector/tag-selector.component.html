<div class="tag-selector">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h5>Filter by Tags</h5>
      <small class="text-muted">
        Showing {{ filteredRecipes?.length ?? 0 }} of {{ totalRecipes }} recipes
      </small>
    </div>
    <div class="tag-actions">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [attr.aria-expanded]="!areTagsCollapsed"
        aria-controls="tag-buttons"
        (click)="toggleTagsCollapsed()"
      >
        {{ areTagsCollapsed ? 'Show tags' : 'Hide tags' }}
      </button>
      <button
        *ngIf="selectedTags.size > 0"
        type="button"
        class="btn btn-sm btn-secondary"
        (click)="clearFilters()"
      >
        Clear Filters
      </button>
    </div>
  </div>

  <div *ngIf="!areTagsCollapsed" id="tag-buttons" class="tag-buttons mt-3">
    <button
      *ngFor="let tag of allTags"
      type="button"
      class="btn btn-sm me-2 mb-2"
      [ngClass]="{
        'btn-info': isTagSelected(tag),
        'btn-outline-info': !isTagSelected(tag),
        disabled: !isTagAvailable(tag) && !isTagSelected(tag)
      }"
      [disabled]="!isTagAvailable(tag) && !isTagSelected(tag)"
      (click)="toggleTag(tag)"
    >
      {{ tag }} ({{ getTagRecipeCount(tag) }})
    </button>
  </div>
</div>
