server {
  listen 80;
  server_name _;

  # Serve SPA with fallback to index.html
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    
    # Cache control for SPA shell
    add_header Cache-Control "public, max-age=3600";
  }

  # API and data endpoints
  location ^~ /assets/data {
    alias /usr/share/nginx/html/assets/data;
    try_files $uri =404;
    
    # Recipe data can change without a filename change.
    add_header Cache-Control "private, max-age=3600";
    expires 1h;
  }

  # Hashed build assets
  location ~* \.(js|css|woff|woff2|eot|ttf)$ {
    root /usr/share/nginx/html;
    
    # Immutable assets (production)
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
  }

  # Unhashed media assets
  location ~* \.(svg|jpg|jpeg|png|gif|ico)$ {
    root /usr/share/nginx/html;
    
    # Cache images for a day because their filenames are not content-hashed.
    add_header Cache-Control "public, max-age=86400";
    expires 1d;
  }

  # Disable caching for index.html
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
  gzip_min_length 1024;
  gzip_disable "msie6";

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
