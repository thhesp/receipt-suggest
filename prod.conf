server {
    listen       8080;
    server_name  _;

    access_log  /var/log/nginx/host.access.log  main;
    auth_basic           "Receipt Suggest";
    auth_basic_user_file /usr/share/.htpasswd;

    location / {
        root   /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/data {
        alias /usr/share/nginx/html/assets/data;
        try_files $uri =404;
    }

    include /etc/nginx/user-state.conf;
}
